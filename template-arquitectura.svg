<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="Apps Project Template - System Architecture">
<defs>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,Inter,Helvetica,Arial,sans-serif}
  .t1{fill:#FFFFFF;font-size:40px;font-weight:700}
  .t2{fill:#8A93A8;font-size:19px}
  .sec{fill:#5D6780;font-size:15px;font-weight:600;letter-spacing:2.5px}
  .tag{font-size:12px;font-weight:700;letter-spacing:1.6px}
  .nt{fill:#FFFFFF;font-size:23px;font-weight:600}
  .nd{fill:#98A2B8;font-size:15px}
  .pl{fill:#C7CEDC;font-size:14px}
  .co{fill:#B4A5F0;font-size:13px;font-weight:700;letter-spacing:1.6px}
  .cd{fill:#A79AD4;font-size:16px}
  .ft{fill:#5D6780;font-size:14px}
</style>
<marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
  <path d="M0,0 L10,4 L0,8 Z" fill="#5A6580"/>
</marker>
</defs>

<rect width="1600" height="1100" fill="#0A0E1A"/>

<text class="t1" x="800" y="68" text-anchor="middle">Apps Project Template &#8212; System Architecture</text>
<text class="t2" x="800" y="106" text-anchor="middle">A running skeleton on day one &#183; The domain is the only empty part</text>
<line x1="100" y1="142" x2="1500" y2="142" stroke="#1E2740" stroke-width="1"/>
<text class="sec" x="100" y="188">MONOREPO &#183; PNPM WORKSPACES</text>

<rect x="200" y="216" width="1200" height="140" rx="14" fill="#0C2029" stroke="#22D3EE" stroke-width="1.5"/>
<text class="tag" x="232" y="250" fill="#22D3EE">FRONTEND</text>
<text class="nt" x="232" y="288">Authenticated shell, ready to use</text>
<text class="nd" x="1368" y="288" text-anchor="end">React 18 &#183; Vite &#183; Radix/shadcn &#183; i18n es/en</text>
<rect x="232" y="306" width="78" height="32" rx="16" fill="#0E2830" stroke="#1B7F94" stroke-width="1"/>
<text class="pl" x="271" y="327" text-anchor="middle">Login</text>
<rect x="322" y="306" width="108" height="32" rx="16" fill="#0E2830" stroke="#1B7F94" stroke-width="1"/>
<text class="pl" x="376" y="327" text-anchor="middle">App shell</text>
<rect x="442" y="306" width="124" height="32" rx="16" fill="#0E2830" stroke="#1B7F94" stroke-width="1"/>
<text class="pl" x="504" y="327" text-anchor="middle">Admin base</text>
<rect x="578" y="306" width="116" height="32" rx="16" fill="#0E2830" stroke="#1B7F94" stroke-width="1"/>
<text class="pl" x="636" y="327" text-anchor="middle">My profile</text>
<rect x="706" y="306" width="138" height="32" rx="16" fill="#0E2830" stroke="#1B7F94" stroke-width="1"/>
<text class="pl" x="775" y="327" text-anchor="middle">Notifications</text>
<rect x="856" y="306" width="112" height="32" rx="16" fill="#0E2830" stroke="#1B7F94" stroke-width="1"/>
<text class="pl" x="912" y="327" text-anchor="middle">Dark mode</text>

<line x1="800" y1="360" x2="800" y2="388" stroke="#5A6580" stroke-width="2" marker-end="url(#ag)"/>

<rect x="200" y="392" width="1200" height="118" rx="14" fill="#16112E" stroke="#8B5CF6" stroke-width="1.5"/>
<text class="tag" x="232" y="426" fill="#A78BFA">SHARED</text>
<text class="nt" x="232" y="464">@app/shared</text>
<text class="nd" x="232" y="493">Zod schemas and types &#8212; one definition used by both sides</text>
<text class="nd" x="1368" y="464" text-anchor="end">no duplicated contracts</text>

<line x1="800" y1="514" x2="800" y2="542" stroke="#5A6580" stroke-width="2" marker-end="url(#ag)"/>

<rect x="200" y="546" width="1200" height="140" rx="14" fill="#18220F" stroke="#A3E635" stroke-width="1.5"/>
<text class="tag" x="232" y="580" fill="#A3E635">BACKEND</text>
<text class="nt" x="232" y="618">Auth, admin and infrastructure</text>
<text class="nd" x="1368" y="618" text-anchor="end">Express &#183; Prisma &#183; OpenAPI at /api/docs</text>
<rect x="232" y="636" width="146" height="32" rx="16" fill="#1C2712" stroke="#5E7A22" stroke-width="1"/>
<text class="pl" x="305" y="657" text-anchor="middle">Auth + lockout</text>
<rect x="390" y="636" width="150" height="32" rx="16" fill="#1C2712" stroke="#5E7A22" stroke-width="1"/>
<text class="pl" x="465" y="657" text-anchor="middle">RBAC &#183; 5 roles</text>
<rect x="552" y="636" width="140" height="32" rx="16" fill="#1C2712" stroke="#5E7A22" stroke-width="1"/>
<text class="pl" x="622" y="657" text-anchor="middle">Users &amp; areas</text>
<rect x="704" y="636" width="170" height="32" rx="16" fill="#1C2712" stroke="#5E7A22" stroke-width="1"/>
<text class="pl" x="789" y="657" text-anchor="middle">Audit (hash chain)</text>
<rect x="886" y="636" width="106" height="32" rx="16" fill="#1C2712" stroke="#5E7A22" stroke-width="1"/>
<text class="pl" x="939" y="657" text-anchor="middle">API keys</text>

<line x1="800" y1="690" x2="800" y2="718" stroke="#5A6580" stroke-width="2" marker-end="url(#ag)"/>

<rect x="200" y="722" width="1200" height="118" rx="14" fill="#0C2135" stroke="#38BDF8" stroke-width="1.5"/>
<text class="tag" x="232" y="756" fill="#38BDF8">DATA &amp; STORAGE</text>
<text class="nt" x="232" y="794">PostgreSQL &#183; MinIO</text>
<text class="nd" x="232" y="823">Relational data plus object storage, both containerized</text>
<text class="nd" x="1368" y="794" text-anchor="end">Docker &#183; GitLab CI</text>

<rect x="200" y="878" width="1200" height="96" rx="14" fill="#12102A" stroke="#6D5FD8" stroke-width="1.5" stroke-dasharray="8 6"/>
<text class="co" x="232" y="912">THE DOMAIN IS EMPTY BY DESIGN</text>
<text class="cd" x="232" y="945">Each project builds its own, one vertical slice at a time: shared &#8594; prisma &#8594; backend &#8594; frontend</text>

<line x1="100" y1="1008" x2="1500" y2="1008" stroke="#1E2740" stroke-width="1"/>
<text class="ft" x="800" y="1048" text-anchor="middle">3 packages &#183; 8 base data models &#183; unit tests + Playwright e2e &#183; Docker &#183; GitLab CI</text>
</svg>
