<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 830" width="1600" height="830" role="img" aria-label="Apps Project Template - Development Methodology">
<defs>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,Inter,Helvetica,Arial,sans-serif}
  .t1{fill:#FFFFFF;font-size:40px;font-weight:700}
  .t2{fill:#8A93A8;font-size:19px}
  .sec{fill:#5D6780;font-size:15px;font-weight:600;letter-spacing:2.5px}
  .note{fill:#6E7891;font-size:14px;font-style:italic}
  .ht{fill:#FFFFFF;font-size:21px;font-weight:600}
  .hd{fill:#98A2B8;font-size:14px}
  .hw{fill:#22D3EE;font-size:13px}
  .num{fill:#FFFFFF;font-size:17px;font-weight:700}
  .ct{fill:#FFFFFF;font-size:20px;font-weight:600}
  .bd{fill:#98A2B8;font-size:14px}
  .lp{fill:#7E76A8;font-size:14px;font-style:italic}
  .ft{fill:#5D6780;font-size:14px}
</style>
<marker id="ac" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
  <path d="M0,0 L10,4 L0,8 Z" fill="#22D3EE"/>
</marker>
<marker id="ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
  <path d="M0,0 L10,4 L0,8 Z" fill="#8B5CF6"/>
</marker>
</defs>

<rect width="1600" height="830" fill="#0A0E1A"/>

<text class="t1" x="800" y="68" text-anchor="middle">Apps Project Template &#8212; Development Method</text>
<text class="t2" x="800" y="106" text-anchor="middle">The specification is the source of truth, not the code</text>
<line x1="100" y1="142" x2="1500" y2="142" stroke="#1E2740" stroke-width="1"/>

<text class="sec" x="100" y="188">TIER 1 &#183; THE STRATEGIC MAP</text>
<text class="note" x="1500" y="188" text-anchor="end">written once per release, revisited by deltas</text>

<rect x="100" y="216" width="320" height="132" rx="14" fill="#0C2029" stroke="#22D3EE" stroke-width="1.5"/>
<text class="ht" x="122" y="258">Epic</text>
<text class="hd" x="122" y="290">A business outcome.</text>
<text class="hw" x="122" y="316">for the client</text>

<line x1="424" y1="282" x2="456" y2="282" stroke="#22D3EE" stroke-width="2" marker-end="url(#ac)"/>

<rect x="460" y="216" width="320" height="132" rx="14" fill="#0C2029" stroke="#22D3EE" stroke-width="1.5"/>
<text class="ht" x="482" y="258">Capability</text>
<text class="hd" x="482" y="290">A coherent area of behaviour.</text>
<text class="hw" x="482" y="316">the unit of work and ownership</text>

<line x1="784" y1="282" x2="816" y2="282" stroke="#22D3EE" stroke-width="2" marker-end="url(#ac)"/>

<rect x="820" y="216" width="320" height="132" rx="14" fill="#0C2029" stroke="#22D3EE" stroke-width="1.5"/>
<text class="ht" x="842" y="258">User Story</text>
<text class="hd" x="842" y="290">An increment inside one.</text>
<text class="hw" x="842" y="316">the unit of delivery</text>

<line x1="1144" y1="282" x2="1176" y2="282" stroke="#22D3EE" stroke-width="2" marker-end="url(#ac)"/>

<rect x="1180" y="216" width="320" height="132" rx="14" fill="#0C2029" stroke="#22D3EE" stroke-width="1.5"/>
<text class="ht" x="1202" y="258">Scenario</text>
<text class="hd" x="1202" y="290">A verifiable criterion.</text>
<text class="hw" x="1202" y="316">the unit of testing</text>

<line x1="100" y1="396" x2="1500" y2="396" stroke="#1E2740" stroke-width="1"/>

<text class="sec" x="100" y="442">TIER 2 &#183; ONE CYCLE PER CAPABILITY</text>
<text class="note" x="1500" y="442" text-anchor="end">the analyst agent proposes &#183; people review and approve</text>

<rect x="100" y="470" width="320" height="180" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="134" cy="508" r="17" fill="#7C3AED"/>
<text class="num" x="134" y="514" text-anchor="middle">1</text>
<text class="ct" x="164" y="516">Explore</text>
<line x1="122" y1="540" x2="398" y2="540" stroke="#2E2555" stroke-width="1"/>
<text class="bd" x="122" y="582">Clarify the stories and</text>
<text class="bd" x="122" y="604">the open questions for</text>
<text class="bd" x="122" y="626">that capability.</text>

<line x1="424" y1="560" x2="456" y2="560" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ap)"/>

<rect x="460" y="470" width="320" height="180" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="494" cy="508" r="17" fill="#7C3AED"/>
<text class="num" x="494" y="514" text-anchor="middle">2</text>
<text class="ct" x="524" y="516">Propose</text>
<line x1="482" y1="540" x2="758" y2="540" stroke="#2E2555" stroke-width="1"/>
<text class="bd" x="482" y="582">Write the spec: EARS</text>
<text class="bd" x="482" y="604">requirements plus</text>
<text class="bd" x="482" y="626">verifiable scenarios.</text>

<line x1="784" y1="560" x2="816" y2="560" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ap)"/>

<rect x="820" y="470" width="320" height="180" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="854" cy="508" r="17" fill="#7C3AED"/>
<text class="num" x="854" y="514" text-anchor="middle">3</text>
<text class="ct" x="884" y="516">Apply</text>
<line x1="842" y1="540" x2="1118" y2="540" stroke="#2E2555" stroke-width="1"/>
<text class="bd" x="842" y="582">Implement the vertical</text>
<text class="bd" x="842" y="604">slice, shared to frontend,</text>
<text class="bd" x="842" y="626">on its own branch.</text>

<line x1="1144" y1="560" x2="1176" y2="560" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ap)"/>

<rect x="1180" y="470" width="320" height="180" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="1214" cy="508" r="17" fill="#7C3AED"/>
<text class="num" x="1214" y="514" text-anchor="middle">4</text>
<text class="ct" x="1244" y="516">Archive</text>
<line x1="1202" y1="540" x2="1478" y2="540" stroke="#2E2555" stroke-width="1"/>
<text class="bd" x="1202" y="582">Merge the delta into</text>
<text class="bd" x="1202" y="604">the living specification.</text>

<path d="M 1340 650 L 1340 700 L 260 700 L 260 658" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#ap)"/>
<rect x="700" y="686" width="200" height="28" fill="#0A0E1A"/>
<text class="lp" x="800" y="705" text-anchor="middle">next capability</text>

<line x1="100" y1="752" x2="1500" y2="752" stroke="#1E2740" stroke-width="1"/>
<text class="ft" x="800" y="792" text-anchor="middle">Built on EARS &#183; Specification by Example &#183; User Story Mapping &#183; DDD &#183; Walking Skeleton</text>
</svg>
