<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 870" width="1600" height="870" role="img" aria-label="Engineering Management Platform - Functional Flow">
<defs>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,Inter,Helvetica,Arial,sans-serif}
  .t1{fill:#FFFFFF;font-size:40px;font-weight:700}
  .t2{fill:#8A93A8;font-size:19px}
  .sec{fill:#5D6780;font-size:15px;font-weight:600;letter-spacing:2.5px}
  .num{fill:#FFFFFF;font-size:17px;font-weight:700}
  .ct{fill:#FFFFFF;font-size:20px;font-weight:600}
  .bd{fill:#98A2B8;font-size:14px}
  .nt{fill:#FFFFFF;font-size:20px;font-weight:600}
  .nd{fill:#8794AB;font-size:14px}
  .sc{fill:#C7BEF5;font-size:16px}
  .ft{fill:#5D6780;font-size:14px}
</style>
<marker id="ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
  <path d="M0,0 L10,4 L0,8 Z" fill="#8B5CF6"/>
</marker>
</defs>

<rect width="1600" height="870" fill="#0A0E1A"/>

<text class="t1" x="800" y="68" text-anchor="middle">Engineering Management &#8212; Functional Flow</text>
<text class="t2" x="800" y="106" text-anchor="middle">Nothing reaches live data without an approved, attributable change</text>
<line x1="100" y1="142" x2="1500" y2="142" stroke="#1E2740" stroke-width="1"/>
<text class="sec" x="100" y="190">FROM ACCESS TO INSIGHT</text>

<rect x="100" y="230" width="320" height="200" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="134" cy="268" r="17" fill="#7C3AED"/>
<text class="num" x="134" y="274" text-anchor="middle">1</text>
<text class="ct" x="164" y="276">Import</text>
<line x1="122" y1="300" x2="398" y2="300" stroke="#2E2555" stroke-width="1"/>
<text class="bd" x="122" y="342">A read-only export arrives</text>
<text class="bd" x="122" y="364">from the corporate systems.</text>
<text class="bd" x="122" y="386">Nothing is written yet.</text>

<line x1="424" y1="330" x2="456" y2="330" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ap)"/>

<rect x="460" y="230" width="320" height="200" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="494" cy="268" r="17" fill="#7C3AED"/>
<text class="num" x="494" y="274" text-anchor="middle">2</text>
<text class="ct" x="524" y="276">Staging</text>
<line x1="482" y1="300" x2="758" y2="300" stroke="#2E2555" stroke-width="1"/>
<text class="bd" x="482" y="342">Every incoming change</text>
<text class="bd" x="482" y="364">lands in a staging area,</text>
<text class="bd" x="482" y="386">isolated from live data.</text>

<line x1="784" y1="330" x2="816" y2="330" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ap)"/>

<rect x="820" y="230" width="320" height="200" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="854" cy="268" r="17" fill="#7C3AED"/>
<text class="num" x="854" y="274" text-anchor="middle">3</text>
<text class="ct" x="884" y="276">Review</text>
<line x1="842" y1="300" x2="1118" y2="300" stroke="#2E2555" stroke-width="1"/>
<text class="bd" x="842" y="342">An owner approves or</text>
<text class="bd" x="842" y="364">rejects, change by change.</text>
<text class="bd" x="842" y="386">Only approved ones move on.</text>

<line x1="1144" y1="330" x2="1176" y2="330" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ap)"/>

<rect x="1180" y="230" width="320" height="200" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="1214" cy="268" r="17" fill="#7C3AED"/>
<text class="num" x="1214" y="274" text-anchor="middle">4</text>
<text class="ct" x="1244" y="276">Live Org Chart</text>
<line x1="1202" y1="300" x2="1478" y2="300" stroke="#2E2555" stroke-width="1"/>
<text class="bd" x="1202" y="342">The approved structure</text>
<text class="bd" x="1202" y="364">becomes the single source</text>
<text class="bd" x="1202" y="386">of truth for the platform.</text>

<line x1="1340" y1="430" x2="1340" y2="486" stroke="#8B5CF6" stroke-width="1.5"/>
<line x1="390" y1="486" x2="1340" y2="486" stroke="#8B5CF6" stroke-width="1.5"/>
<line x1="390" y1="486" x2="390" y2="516" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#ap)"/>
<line x1="800" y1="486" x2="800" y2="516" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#ap)"/>
<line x1="1210" y1="486" x2="1210" y2="516" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#ap)"/>

<rect x="200" y="524" width="380" height="100" rx="14" fill="#0F1A2A" stroke="#3E5A7A" stroke-width="1.5"/>
<text class="nt" x="390" y="566" text-anchor="middle">Suppliers</text>
<text class="nd" x="390" y="593" text-anchor="middle">deduplicated engineering catalog</text>

<rect x="610" y="524" width="380" height="100" rx="14" fill="#0F1A2A" stroke="#3E5A7A" stroke-width="1.5"/>
<text class="nt" x="800" y="566" text-anchor="middle">Purchase Orders</text>
<text class="nd" x="800" y="593" text-anchor="middle">commitments and status</text>

<rect x="1020" y="524" width="380" height="100" rx="14" fill="#0F1A2A" stroke="#3E5A7A" stroke-width="1.5"/>
<text class="nt" x="1210" y="566" text-anchor="middle">Dashboards</text>
<text class="nd" x="1210" y="593" text-anchor="middle">one view per department</text>

<rect x="420" y="666" width="760" height="52" rx="26" fill="#16112E" stroke="#6D4FD8" stroke-width="1.5"/>
<text class="sc" x="800" y="699" text-anchor="middle">Every edit is scoped to the department that owns the data</text>

<line x1="100" y1="776" x2="1500" y2="776" stroke="#1E2740" stroke-width="1"/>
<text class="ft" x="800" y="816" text-anchor="middle">12 capabilities specified &amp; approved &#183; 107 granular permissions &#183; 3 layers of defense-in-depth</text>
</svg>
