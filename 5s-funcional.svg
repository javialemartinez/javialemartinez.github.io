<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-label="5S Lean Platform - Functional Flow">
<defs>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,Inter,Helvetica,Arial,sans-serif}
  .t1{fill:#FFFFFF;font-size:40px;font-weight:700}
  .t2{fill:#8A93A8;font-size:19px}
  .sec{fill:#5D6780;font-size:15px;font-weight:600;letter-spacing:2.5px}
  .lg{fill:#8A93A8;font-size:14px}
  .num{fill:#FFFFFF;font-size:17px;font-weight:700}
  .ct{fill:#FFFFFF;font-size:20px;font-weight:600}
  .rl{font-size:11px;font-weight:700;letter-spacing:1.4px}
  .bd{fill:#98A2B8;font-size:14px}
  .lp{fill:#7E76A8;font-size:14px;font-style:italic}
  .ft{fill:#5D6780;font-size:14px}
</style>
<marker id="ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
  <path d="M0,0 L10,4 L0,8 Z" fill="#8B5CF6"/>
</marker>
</defs>

<rect width="1600" height="760" fill="#0A0E1A"/>

<text class="t1" x="800" y="68" text-anchor="middle">5S Lean Platform &#8212; Functional Flow</text>
<text class="t2" x="800" y="106" text-anchor="middle">From a shop-floor audit to a tracked improvement</text>
<line x1="100" y1="142" x2="1500" y2="142" stroke="#1E2740" stroke-width="1"/>

<text class="sec" x="100" y="190">AUDIT-TO-IMPROVEMENT CYCLE</text>
<circle cx="1268" cy="172" r="5" fill="#38BDF8"/>
<text class="lg" x="1284" y="177">ROLE &#8212; what the person does</text>
<circle cx="1268" cy="198" r="5" fill="#A3E635"/>
<text class="lg" x="1284" y="203">SYSTEM &#8212; what the app does</text>

<!-- 1 -->
<rect x="100" y="230" width="320" height="340" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="134" cy="268" r="17" fill="#7C3AED"/>
<text class="num" x="134" y="274" text-anchor="middle">1</text>
<text class="ct" x="164" y="276">Audit</text>
<line x1="122" y1="300" x2="398" y2="300" stroke="#2E2555" stroke-width="1"/>
<circle cx="127" cy="331" r="4" fill="#38BDF8"/>
<text class="rl" x="140" y="336" fill="#38BDF8">ROLE</text>
<text class="bd" x="122" y="364">Operator runs the checklist</text>
<text class="bd" x="122" y="386">on mobile, attaching photo</text>
<text class="bd" x="122" y="408">evidence for each finding.</text>
<circle cx="127" cy="446" r="4" fill="#A3E635"/>
<text class="rl" x="140" y="451" fill="#A3E635">SYSTEM</text>
<text class="bd" x="122" y="479">Scores every item against</text>
<text class="bd" x="122" y="501">the 5S standard and stores</text>
<text class="bd" x="122" y="523">the evidence.</text>

<line x1="424" y1="400" x2="456" y2="400" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ap)"/>

<!-- 2 -->
<rect x="460" y="230" width="320" height="340" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="494" cy="268" r="17" fill="#7C3AED"/>
<text class="num" x="494" y="274" text-anchor="middle">2</text>
<text class="ct" x="524" y="276">Sign-off</text>
<line x1="482" y1="300" x2="758" y2="300" stroke="#2E2555" stroke-width="1"/>
<circle cx="487" cy="331" r="4" fill="#38BDF8"/>
<text class="rl" x="500" y="336" fill="#38BDF8">ROLE</text>
<text class="bd" x="482" y="364">Supervisor reviews the</text>
<text class="bd" x="482" y="386">audit and signs it digitally.</text>
<circle cx="487" cy="446" r="4" fill="#A3E635"/>
<text class="rl" x="500" y="451" fill="#A3E635">SYSTEM</text>
<text class="bd" x="482" y="479">Locks the record and</text>
<text class="bd" x="482" y="501">stamps who signed it,</text>
<text class="bd" x="482" y="523">and when.</text>

<line x1="784" y1="400" x2="816" y2="400" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ap)"/>

<!-- 3 -->
<rect x="820" y="230" width="320" height="340" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="854" cy="268" r="17" fill="#7C3AED"/>
<text class="num" x="854" y="274" text-anchor="middle">3</text>
<text class="ct" x="884" y="276">Corrective Action</text>
<line x1="842" y1="300" x2="1118" y2="300" stroke="#2E2555" stroke-width="1"/>
<circle cx="847" cy="331" r="4" fill="#38BDF8"/>
<text class="rl" x="860" y="336" fill="#38BDF8">ROLE</text>
<text class="bd" x="842" y="364">An owner and a due date</text>
<text class="bd" x="842" y="386">are assigned.</text>
<circle cx="847" cy="446" r="4" fill="#A3E635"/>
<text class="rl" x="860" y="451" fill="#A3E635">SYSTEM</text>
<text class="bd" x="842" y="479">Any score below the</text>
<text class="bd" x="842" y="501">threshold auto-generates</text>
<text class="bd" x="842" y="523">the action.</text>

<line x1="1144" y1="400" x2="1176" y2="400" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ap)"/>

<!-- 4 -->
<rect x="1180" y="230" width="320" height="340" rx="14" fill="#140F2B" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="1214" cy="268" r="17" fill="#7C3AED"/>
<text class="num" x="1214" y="274" text-anchor="middle">4</text>
<text class="ct" x="1244" y="276">Improvement Board</text>
<line x1="1202" y1="300" x2="1478" y2="300" stroke="#2E2555" stroke-width="1"/>
<circle cx="1207" cy="331" r="4" fill="#38BDF8"/>
<text class="rl" x="1220" y="336" fill="#38BDF8">ROLE</text>
<text class="bd" x="1202" y="364">The team works the board</text>
<text class="bd" x="1202" y="386">and updates status.</text>
<circle cx="1207" cy="446" r="4" fill="#A3E635"/>
<text class="rl" x="1220" y="451" fill="#A3E635">SYSTEM</text>
<text class="bd" x="1202" y="479">Tracks corrective actions</text>
<text class="bd" x="1202" y="501">and improvement proposals</text>
<text class="bd" x="1202" y="523">on one shared Kanban.</text>

<path d="M 1340 570 L 1340 634 L 260 634 L 260 578" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#ap)"/>
<rect x="668" y="620" width="264" height="28" fill="#0A0E1A"/>
<text class="lp" x="800" y="639" text-anchor="middle">continuous improvement cycle</text>

<line x1="100" y1="686" x2="1500" y2="686" stroke="#1E2740" stroke-width="1"/>
<text class="ft" x="800" y="724" text-anchor="middle">7 epics &#183; 42 capabilities mapped &#183; 95% test coverage on scoring and permissions</text>
</svg>
