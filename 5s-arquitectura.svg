<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="5S Lean Platform - System Architecture">
<defs>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,Inter,Helvetica,Arial,sans-serif}
  .t1{fill:#FFFFFF;font-size:40px;font-weight:700}
  .t2{fill:#8A93A8;font-size:19px}
  .sec{fill:#5D6780;font-size:15px;font-weight:600;letter-spacing:2.5px}
  .tag{font-size:12px;font-weight:700;letter-spacing:1.6px}
  .nt{fill:#FFFFFF;font-size:23px;font-weight:600}
  .nd{fill:#98A2B8;font-size:15px}
  .pl{fill:#C7CEDC;font-size:14px}
  .ft{fill:#5D6780;font-size:14px}
</style>
<marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
  <path d="M0,0 L10,4 L0,8 Z" fill="#5A6580"/>
</marker>
</defs>

<rect width="1600" height="1000" fill="#0A0E1A"/>

<text class="t1" x="800" y="68" text-anchor="middle">5S Lean Platform &#8212; System Architecture</text>
<text class="t2" x="800" y="106" text-anchor="middle">Layered architecture &#183; Pure domain core &#183; Mobile-first audits</text>
<line x1="100" y1="142" x2="1500" y2="142" stroke="#1E2740" stroke-width="1"/>
<text class="sec" x="100" y="188">LAYERED ARCHITECTURE</text>

<rect x="200" y="216" width="1200" height="126" rx="14" fill="#0C2029" stroke="#22D3EE" stroke-width="1.5"/>
<text class="tag" x="232" y="250" fill="#22D3EE">PRESENTATION</text>
<text class="nt" x="232" y="288">Web &amp; mobile SPA</text>
<text class="nd" x="232" y="317">Checklist audits with photo evidence, usable on the shop floor</text>
<text class="nd" x="1368" y="288" text-anchor="end">React 18 &#183; TypeScript &#183; Vite</text>

<line x1="800" y1="346" x2="800" y2="372" stroke="#5A6580" stroke-width="2" marker-end="url(#ag)"/>

<rect x="200" y="378" width="1200" height="126" rx="14" fill="#18220F" stroke="#A3E635" stroke-width="1.5"/>
<text class="tag" x="232" y="412" fill="#A3E635">API</text>
<text class="nt" x="232" y="450">Versioned REST API</text>
<text class="nd" x="232" y="479">A stable contract between the client and the domain</text>
<text class="nd" x="1368" y="450" text-anchor="end">Fastify &#183; Node.js</text>

<line x1="800" y1="508" x2="800" y2="534" stroke="#5A6580" stroke-width="2" marker-end="url(#ag)"/>

<rect x="200" y="540" width="1200" height="150" rx="14" fill="#16112E" stroke="#8B5CF6" stroke-width="1.5"/>
<text class="tag" x="232" y="574" fill="#A78BFA">DOMAIN &#183; THE CORE</text>
<text class="nt" x="232" y="612">Pure business rules</text>
<text class="nd" x="1368" y="612" text-anchor="end">no framework &#183; no I/O</text>
<rect x="232" y="632" width="118" height="32" rx="16" fill="#1E1840" stroke="#6D4FD8" stroke-width="1"/>
<text class="pl" x="291" y="653" text-anchor="middle">5S scoring</text>
<rect x="362" y="632" width="80" height="32" rx="16" fill="#1E1840" stroke="#6D4FD8" stroke-width="1"/>
<text class="pl" x="402" y="653" text-anchor="middle">RBAC</text>
<rect x="454" y="632" width="148" height="32" rx="16" fill="#1E1840" stroke="#6D4FD8" stroke-width="1"/>
<text class="pl" x="528" y="653" text-anchor="middle">Digital sign-off</text>
<rect x="614" y="632" width="150" height="32" rx="16" fill="#1E1840" stroke="#6D4FD8" stroke-width="1"/>
<text class="pl" x="689" y="653" text-anchor="middle">State machines</text>

<line x1="800" y1="694" x2="800" y2="720" stroke="#5A6580" stroke-width="2" marker-end="url(#ag)"/>

<rect x="200" y="726" width="1200" height="126" rx="14" fill="#0C2135" stroke="#38BDF8" stroke-width="1.5"/>
<text class="tag" x="232" y="760" fill="#38BDF8">INFRASTRUCTURE</text>
<text class="nt" x="232" y="798">Persistence &amp; storage</text>
<text class="nd" x="232" y="827">Relational data, plus photo evidence stored as objects</text>
<text class="nd" x="1368" y="798" text-anchor="end">MySQL &#183; S3-compatible storage</text>

<line x1="100" y1="906" x2="1500" y2="906" stroke="#1E2740" stroke-width="1"/>
<text class="ft" x="800" y="946" text-anchor="middle">Stack &#183; React 18 &#183; TypeScript &#183; Fastify &#183; MySQL &#183; Docker &#183; GitLab CI</text>
</svg>
