<text class="md" x="428" y="573" text-anchor="middle">structure &amp; positions</text>

<rect x="624" y="510" width="352" height="88" rx="12" fill="#0F1A2A" stroke="#3E5A7A" stroke-width="1.5"/>
<text class="mt" x="800" y="549" text-anchor="middle">Human Capabilities</text>
<text class="md" x="800" y="573" text-anchor="middle">skills, experience, team fit</text>

<rect x="996" y="510" width="352" height="88" rx="12" fill="#0F1A2A" stroke="#3E5A7A" stroke-width="1.5"/>
<text class="mt" x="1172" y="549" text-anchor="middle">Departments</text>
<text class="md" x="1172" y="573" text-anchor="middle">ownership boundaries</text>

<rect x="252" y="618" width="352" height="88" rx="12" fill="#0F1A2A" stroke="#3E5A7A" stroke-width="1.5"/>
<text class="mt" x="428" y="657" text-anchor="middle">Suppliers</text>
<text class="md" x="428" y="681" text-anchor="middle">engineering catalog</text>

<rect x="624" y="618" width="352" height="88" rx="12" fill="#0F1A2A" stroke="#3E5A7A" stroke-width="1.5"/>
<text class="mt" x="800" y="657" text-anchor="middle">Purchase Orders</text>
<text class="md" x="800" y="681" text-anchor="middle">commitments &amp; status</text>

<rect x="996" y="618" width="352" height="88" rx="12" fill="#0F1A2A" stroke="#3E5A7A" stroke-width="1.5"/>
<text class="mt" x="1172" y="657" text-anchor="middle">Audit Trail</text>
<text class="md" x="1172" y="681" text-anchor="middle">who changed what</text>

<line x1="390" y1="744" x2="390" y2="786" stroke="#5A6580" stroke-width="2" marker-end="url(#ag)"/>
<line x1="800" y1="744" x2="800" y2="786" stroke="#5A6580" stroke-width="2" marker-end="url(#ag)"/>
<path d="M 1210 744 L 1210 786" fill="none" stroke="#6D5FD8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ap)"/>
<text class="lb" x="1226" y="772">change feed</text>

<rect x="200" y="790" width="380" height="100" rx="14" fill="#0C2135" stroke="#38BDF8" stroke-width="1.5"/>
<text class="nt" x="390" y="832" text-anchor="middle">PostgreSQL</text>
<text class="nd" x="390" y="860" text-anchor="middle">Row Level Security</text>

<rect x="610" y="790" width="380" height="100" rx="14" fill="#2A1509" stroke="#F97316" stroke-width="1.5"/>
<text class="nt" x="800" y="832" text-anchor="middle">Redis</text>
<text class="nd" x="800" y="860" text-anchor="middle">cache &amp; queues</text>

<rect x="1020" y="790" width="380" height="100" rx="14" fill="#12102A" stroke="#6D5FD8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="nt" x="1210" y="832" text-anchor="middle" fill="#B4A5F0">Semantic search</text>
<text class="nd" x="1210" y="860" text-anchor="middle">planned &#183; scope already in place</text>

<line x1="100" y1="946" x2="1500" y2="946" stroke="#1E2740" stroke-width="1"/>
<text class="ft" x="800" y="986" text-anchor="middle">Stack &#183; React 18 &#183; TypeScript &#183; NestJS &#183; PostgreSQL (RLS) &#183; Prisma &#183; Redis &#183; Docker</text>
