<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-label="Engineering Management Platform - System Architecture">
<defs>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,Inter,Helvetica,Arial,sans-serif}
  .t1{fill:#FFFFFF;font-size:40px;font-weight:700}
  .t2{fill:#8A93A8;font-size:19px}
  .sec{fill:#5D6780;font-size:15px;font-weight:600;letter-spacing:2.5px}
  .cn{fill:#A78BFA;font-size:13px;font-weight:700;letter-spacing:1.6px}
  .nt{fill:#FFFFFF;font-size:22px;font-weight:600}
  .nd{fill:#98A2B8;font-size:15px}
  .mt{fill:#FFFFFF;font-size:17px;font-weight:600}
  .md{fill:#8794AB;font-size:13px}
