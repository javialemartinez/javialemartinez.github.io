<rect width="1600" height="1040" fill="#0A0E1A"/>

<text class="t1" x="800" y="68" text-anchor="middle">Engineering Management &#8212; System Architecture</text>
<text class="t2" x="800" y="106" text-anchor="middle">Modular monolith &#183; Authorization at the core &#183; One source of truth</text>
<line x1="100" y1="142" x2="1500" y2="142" stroke="#1E2740" stroke-width="1"/>
<text class="sec" x="100" y="188">SYSTEM ARCHITECTURE</text>

<rect x="560" y="216" width="480" height="90" rx="14" fill="#12161F" stroke="#4B5568" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="nt" x="800" y="256" text-anchor="middle">Corporate systems</text>
<text class="nd" x="800" y="283" text-anchor="middle">read-only, incremental imports</text>
<line x1="800" y1="310" x2="800" y2="372" stroke="#5A6580" stroke-width="2" marker-end="url(#ag)"/>

<rect x="200" y="380" width="1200" height="360" rx="16" fill="#0D1120" stroke="#6D5FD8" stroke-width="1.5" stroke-dasharray="8 6"/>
<rect x="224" y="368" width="330" height="24" fill="#0A0E1A"/>
<text class="cn" x="236" y="386">MODULAR MONOLITH &#183; LIGHT DDD</text>

<rect x="232" y="410" width="1136" height="76" rx="12" fill="#16112E" stroke="#8B5CF6" stroke-width="1.5"/>
<text class="nt" x="264" y="457">Granular authorization</text>
<text class="nd" x="1336" y="457" text-anchor="end">107 permissions &#183; 3 layers of defense</text>

<rect x="252" y="510" width="352" height="88" rx="12" fill="#0F1A2A" stroke="#3E5A7A" stroke-width="1.5"/>
